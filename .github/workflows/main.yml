name: Build Vite

# Vérifie que le site se construit bien à chaque envoi sur main.
# Vercel construit et met en ligne le site lui-même : on ne renvoie plus de copie « add dist »
# (elle déclenchait une deuxième mise en ligne à chaque envoi et faisait atteindre la limite de Vercel).

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --legacy-peer-deps

      - run: npm run build
